apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "postgres-secrets") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bsv.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bsv.componentName" (dict "root" . "component" "postgres") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "bsv.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bsv.selectorLabels" (dict "root" . "name" "postgres") | nindent 8 }}
        {{- include "bsv.labels" . | nindent 8 }}
      annotations:
        checksum/postgres-auth: {{ .Values.postgres.auth | toJson | sha256sum | quote }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
              name: postgres
          envFrom:
            - secretRef:
                name: {{ include "bsv.componentName" (dict "root" . "component" "postgres-secrets") }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          {{- include "bsv.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{ if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{ end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
