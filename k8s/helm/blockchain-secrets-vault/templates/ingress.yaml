{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "ingress") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
  {{ with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{ end }}
spec:
  {{ if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{ end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{ if .host }}
      host: {{ .host | quote }}
      {{ end }}
      http:
        paths:
          - path: {{ .apiPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bsv.componentName" (dict "root" $ "component" "secrets-api") }}
                port:
                  number: {{ $.Values.secretsApi.service.port }}
          - path: {{ .frontendPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bsv.componentName" (dict "root" $ "component" "frontend") }}
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end }}
