apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api-config") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
data:
  SECRETS_AUTH_USERNAME: {{ .Values.secretsApi.config.authUsername | quote }}
  SECRETS_AUTH_ISSUER: {{ .Values.secretsApi.config.authIssuer | quote }}
  SECRETS_AUTH_TOKEN_TTL: {{ .Values.secretsApi.config.authTokenTtl | quote }}
  BLOCKCHAIN_ACL_RPC_URL: {{ default (printf "http://%s:%v" (include "bsv.componentName" (dict "root" . "component" "blockchain-node")) .Values.blockchainNode.service.port) .Values.secretsApi.config.blockchainAclRpcUrl | quote }}
  BLOCKCHAIN_ACL_GAS_PRICE: {{ .Values.secretsApi.config.blockchainAclGasPrice | quote }}
  BLOCKCHAIN_ACL_GAS_LIMIT: {{ .Values.secretsApi.config.blockchainAclGasLimit | quote }}
  BLOCKCHAIN_ACL_CHAIN_ID: {{ .Values.secretsApi.config.blockchainAclChainId | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api-secrets") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRETS_AUTH_PASSWORD: {{ required "secretsApi.secrets.authPassword is required" .Values.secretsApi.secrets.authPassword | quote }}
  SECRETS_AUTH_JWT_SECRET: {{ required "secretsApi.secrets.authJwtSecret is required" .Values.secretsApi.secrets.authJwtSecret | quote }}
  BLOCKCHAIN_ACL_CONTRACT_ADDRESS: {{ .Values.secretsApi.secrets.blockchainAclContractAddress | quote }}
  BLOCKCHAIN_ACL_PRIVATE_KEY: {{ .Values.secretsApi.secrets.blockchainAclPrivateKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bsv.selectorLabels" (dict "root" . "name" "secrets-api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.secretsApi.service.port }}
      targetPort: {{ .Values.secretsApi.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.secretsApi.replicas }}
  selector:
    matchLabels:
      {{- include "bsv.selectorLabels" (dict "root" . "name" "secrets-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bsv.selectorLabels" (dict "root" . "name" "secrets-api") | nindent 8 }}
        {{- include "bsv.labels" . | nindent 8 }}
    spec:
      containers:
        - name: secrets-api
          image: {{ .Values.secretsApi.image.repository }}:{{ .Values.secretsApi.image.tag }}
          imagePullPolicy: {{ .Values.secretsApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.secretsApi.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api-config") }}
            - secretRef:
                name: {{ include "bsv.componentName" (dict "root" . "component" "secrets-api-secrets") }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.secretsApi.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.secretsApi.resources | nindent 12 }}
