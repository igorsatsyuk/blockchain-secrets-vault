apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bsv.selectorLabel" "redis" | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      {{- include "bsv.selectorLabel" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bsv.selectorLabel" "redis" | nindent 8 }}
        {{- include "bsv.labels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: {{ .Values.redis.service.port }}
              name: redis
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
