apiVersion: v1
kind: Service
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bsv.selectorLabels" (dict "root" . "name" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bsv.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "bsv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "bsv.selectorLabels" (dict "root" . "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bsv.selectorLabels" (dict "root" . "name" "frontend") | nindent 8 }}
        {{- include "bsv.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
