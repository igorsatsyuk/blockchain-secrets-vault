apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockchain-secrets-vault
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: secrets-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
