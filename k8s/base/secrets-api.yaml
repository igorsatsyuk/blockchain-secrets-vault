apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-api-config
data:
  SECRETS_AUTH_USERNAME: admin
  SECRETS_AUTH_ISSUER: blockchain-secrets-vault
  SECRETS_AUTH_TOKEN_TTL: PT1H
  BLOCKCHAIN_ACL_RPC_URL: http://blockchain-node:8545
  BLOCKCHAIN_ACL_GAS_PRICE: "20000000000"
  BLOCKCHAIN_ACL_GAS_LIMIT: "300000"
  BLOCKCHAIN_ACL_CHAIN_ID: "31337"
---
apiVersion: v1
kind: Secret
metadata:
  name: secrets-api-secrets
type: Opaque
stringData:
  SECRETS_AUTH_PASSWORD: ""
  SECRETS_AUTH_JWT_SECRET: ""
  BLOCKCHAIN_ACL_CONTRACT_ADDRESS: ""
  BLOCKCHAIN_ACL_PRIVATE_KEY: ""
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-api
spec:
  selector:
    app.kubernetes.io/name: secrets-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: secrets-api
          image: ghcr.io/igorsatsyuk/blockchain-secrets-vault/secrets-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SECRETS_AUTH_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: SECRETS_AUTH_USERNAME
            - name: SECRETS_AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: SECRETS_AUTH_ISSUER
            - name: SECRETS_AUTH_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: SECRETS_AUTH_TOKEN_TTL
            - name: BLOCKCHAIN_ACL_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: BLOCKCHAIN_ACL_RPC_URL
            - name: BLOCKCHAIN_ACL_GAS_PRICE
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: BLOCKCHAIN_ACL_GAS_PRICE
            - name: BLOCKCHAIN_ACL_GAS_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: BLOCKCHAIN_ACL_GAS_LIMIT
            - name: BLOCKCHAIN_ACL_CHAIN_ID
              valueFrom:
                configMapKeyRef:
                  name: secrets-api-config
                  key: BLOCKCHAIN_ACL_CHAIN_ID
            - name: SECRETS_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-api-secrets
                  key: SECRETS_AUTH_PASSWORD
            - name: SECRETS_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets-api-secrets
                  key: SECRETS_AUTH_JWT_SECRET
            - name: BLOCKCHAIN_ACL_CONTRACT_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: secrets-api-secrets
                  key: BLOCKCHAIN_ACL_CONTRACT_ADDRESS
            - name: BLOCKCHAIN_ACL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets-api-secrets
                  key: BLOCKCHAIN_ACL_PRIVATE_KEY
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 200m
              ephemeral-storage: 256Mi
              memory: 512Mi
            limits:
              cpu: 1000m
              ephemeral-storage: 512Mi
              memory: 1024Mi
