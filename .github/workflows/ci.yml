name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  blockchain:
    name: Blockchain (Hardhat)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        working-directory: blockchain
        run: npm ci

      - name: Compile contracts
        working-directory: blockchain
        run: npm run compile

      - name: Run Hardhat coverage
        working-directory: blockchain
        run: npm run coverage

      - name: Run JavaScript coverage for deploy scripts
        working-directory: blockchain
        run: npm run coverage:js

      - name: Upload blockchain coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blockchain-coverage
          path: |
            blockchain/coverage/lcov.info
            blockchain/coverage-js/lcov.info
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/secrets-api/target/site/jacoco/jacoco.xml
            backend/kms-service/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend (Secrets UI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm test

      - name: Generate frontend lcov report
        working-directory: frontend
        run: npm run test:lcov

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/lcov.info
          if-no-files-found: warn
          retention-days: 7

  sonar-blockchain:
    name: SonarQube - blockchain
    runs-on: ubuntu-latest
    needs: [ blockchain ]
    if: >
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'))
    outputs:
      sonar_skipped: ${{ steps['sonar-check'].outputs.sonar_skipped }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check Sonar configuration
        id: sonar-check
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_TOKEN not set; skipping blockchain analysis"
            exit 0
          fi
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          if [ "$host_url" = "https://sonarcloud.io" ] && [ -z "$SONAR_ORGANIZATION" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_ORGANIZATION not set for SonarCloud; skipping blockchain analysis"
            exit 0
          fi

          scanner_url="https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip"
          scanner_http_code=$(curl -s -o /dev/null -w "%{http_code}" "$scanner_url" || true)
          if [ "$scanner_http_code" -ge 400 ] || [ "$scanner_http_code" -eq 0 ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "Sonar scanner binary is not reachable (HTTP $scanner_http_code); skipping blockchain analysis"
            exit 0
          fi

          echo "sonar_skipped=false" >> $GITHUB_OUTPUT
          echo "sonar_enabled=true" >> $GITHUB_OUTPUT
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Download blockchain coverage report
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: blockchain-coverage
          path: .

      - name: Use Java 21 for Sonar scanner
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Normalize blockchain lcov path for Sonar
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        run: |
          expected_sol="blockchain/coverage/lcov.info"
          found_sol=$(find . -path "*/coverage/lcov.info" 2>/dev/null | head -1 || true)
          found_sol=${found_sol#./}
          if [ -n "$found_sol" ] && [ "$found_sol" != "$expected_sol" ]; then
            mkdir -p "$(dirname "$expected_sol")"
            cp "$found_sol" "$expected_sol"
            echo "Reorganized Solidity lcov: $found_sol -> $expected_sol"
          fi

          expected_js="blockchain/coverage-js/lcov.info"
          found_js=$(find . -path "*/coverage-js/lcov.info" 2>/dev/null | head -1 || true)
          found_js=${found_js#./}
          if [ -n "$found_js" ] && [ "$found_js" != "$expected_js" ]; then
            mkdir -p "$(dirname "$expected_js")"
            cp "$found_js" "$expected_js"
            echo "Reorganized JS lcov: $found_js -> $expected_js"
          fi

          if [ ! -f "$expected_sol" ] && [ ! -f "$expected_js" ]; then
            echo "No lcov.info reports found; Sonar will run without coverage input"
          fi

      - name: Build blockchain Sonar args
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: sonar-args
        shell: bash
        run: |
          args="-Dsonar.projectKey=${{ github.event.repository.name }}-blockchain -Dsonar.scanner.skipJreProvisioning=true"
          if [ -n "${SONAR_ORGANIZATION}" ]; then
            args="${args} -Dsonar.organization=${SONAR_ORGANIZATION}"
          fi
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube analysis (blockchain)
        id: blockchain-sonar-scan
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: blockchain
          args: ${{ steps['sonar-args'].outputs.args }}

      - name: Retry SonarQube analysis (blockchain)
        if: steps['sonar-check'].outputs.sonar_enabled == 'true' && steps['blockchain-sonar-scan'].outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: blockchain
          args: ${{ steps['sonar-args'].outputs.args }}

      - name: Locate blockchain Sonar report-task
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: report-task
        shell: bash
        run: |
          report_task="blockchain/.scannerwork/report-task.txt"
          if [ ! -f "$report_task" ]; then
            echo "Unable to find blockchain Sonar report-task.txt at $report_task" >&2
            exit 1
          fi
          echo "path=${report_task}" >> "$GITHUB_OUTPUT"

      - name: Wait for Quality Gate and publish blockchain Sonar summary
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          extra_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            extra_args+=("--allow-missing-new-code-metrics")
          fi

          python3 .github/scripts/sonar_quality_gate_report.py \
            --component-name "blockchain" \
            --project-key "${REPO_NAME}-blockchain" \
            --report-task-file "${{ steps['report-task'].outputs.path }}" \
            --timeout-seconds 900 \
            "${extra_args[@]}"

  sonar-backend:
    name: SonarQube - backend
    runs-on: ubuntu-latest
    needs: [ backend ]
    if: >
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'))
    outputs:
      sonar_skipped: ${{ steps['sonar-check'].outputs.sonar_skipped }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check Sonar configuration
        id: sonar-check
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_TOKEN not set; skipping backend analysis"
            exit 0
          fi
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          if [ "$host_url" = "https://sonarcloud.io" ] && [ -z "$SONAR_ORGANIZATION" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_ORGANIZATION not set for SonarCloud; skipping backend analysis"
            exit 0
          fi
          echo "sonar_skipped=false" >> $GITHUB_OUTPUT
          echo "sonar_enabled=true" >> $GITHUB_OUTPUT
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Use Java 25
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Download backend coverage report
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: backend-coverage

      - name: Compile backend for Sonar
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        run: |
          mvn -B -ntp \
            -f backend/pom.xml \
            -Djacoco.skip=true \
            -DskipTests \
            verify

      - name: Build backend Sonar args
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: backend-sonar-args
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          report_paths=""
          if [ -d "backend-coverage" ]; then
            report_paths=$(find "$(pwd)/backend-coverage" -type f -name "jacoco.xml" -print 2>/dev/null | paste -sd, - || true)
          fi

          args="-Dsonar.projectKey=${REPO_NAME}-backend"
          args="${args} -Dsonar.projectName=${REPO_NAME}-backend"
          args="${args} -Dsonar.scanner.skipJreProvisioning=true"

          if [ -n "${report_paths}" ]; then
            args="${args} -Dsonar.coverage.jacoco.xmlReportPaths=${report_paths}"
          else
            echo "JaCoCo XML report not found; Sonar will run without coverage input"
          fi

          if [ -n "${SONAR_ORGANIZATION}" ]; then
            args="${args} -Dsonar.organization=${SONAR_ORGANIZATION}"
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER}" ] && [ -n "${PR_HEAD_REF}" ] && [ -n "${PR_BASE_REF}" ]; then
            args="${args} -Dsonar.pullrequest.key=${PR_NUMBER}"
            args="${args} -Dsonar.pullrequest.branch=${PR_HEAD_REF}"
            args="${args} -Dsonar.pullrequest.base=${PR_BASE_REF}"
          fi

          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube analysis (backend)
        id: backend-sonar-scan
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BACKEND_SONAR_ARGS: ${{ steps['backend-sonar-args'].outputs.args }}
        run: |
          mvn -B -ntp \
            -f backend/pom.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            ${BACKEND_SONAR_ARGS}

      - name: Retry SonarQube analysis (backend)
        if: steps['sonar-check'].outputs.sonar_enabled == 'true' && steps['backend-sonar-scan'].outcome == 'failure'
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BACKEND_SONAR_ARGS: ${{ steps['backend-sonar-args'].outputs.args }}
        run: |
          mvn -B -ntp \
            -f backend/pom.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            ${BACKEND_SONAR_ARGS}

      - name: Locate backend Sonar report-task
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: report-task
        shell: bash
        run: |
          report_task=$(find backend -type f \( -path "*/target/sonar/report-task.txt" -o -path "*/.scannerwork/report-task.txt" \) | head -1)
          if [ -z "$report_task" ]; then
            echo "Unable to find backend Sonar report-task.txt" >&2
            exit 1
          fi
          echo "path=${report_task}" >> "$GITHUB_OUTPUT"

      - name: Wait for Quality Gate and publish backend Sonar summary
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          extra_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            extra_args+=("--allow-missing-new-code-metrics")
          fi

          python3 .github/scripts/sonar_quality_gate_report.py \
            --component-name "backend" \
            --project-key "${REPO_NAME}-backend" \
            --report-task-file "${{ steps['report-task'].outputs.path }}" \
            --timeout-seconds 900 \
            "${extra_args[@]}"

  sonar-frontend:
    name: SonarQube - frontend
    runs-on: ubuntu-latest
    needs: [ frontend ]
    if: >
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'))
    outputs:
      sonar_skipped: ${{ steps['sonar-check'].outputs.sonar_skipped }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check Sonar configuration
        id: sonar-check
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_TOKEN not set; skipping frontend analysis"
            exit 0
          fi
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          if [ "$host_url" = "https://sonarcloud.io" ] && [ -z "$SONAR_ORGANIZATION" ]; then
            echo "sonar_skipped=true" >> $GITHUB_OUTPUT
            echo "SONAR_ORGANIZATION not set for SonarCloud; skipping frontend analysis"
            exit 0
          fi
          echo "sonar_skipped=false" >> $GITHUB_OUTPUT
          echo "sonar_enabled=true" >> $GITHUB_OUTPUT
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Download frontend coverage report
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage
          path: frontend-coverage

      - name: Use Java 21 for Sonar scanner
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Normalize frontend lcov path for Sonar
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        run: |
          expected="frontend/lcov.info"
          found=$(find . -path "*/lcov.info" 2>/dev/null | head -1 || true)
          found=${found#./}
          if [ -n "$found" ] && [ "$found" != "$expected" ]; then
            mkdir -p "$(dirname "$expected")"
            cp "$found" "$expected"
            echo "Reorganized frontend lcov: $found -> $expected"
          fi
          if [ ! -f "$expected" ]; then
            echo "No frontend lcov.info report found; Sonar will run without coverage input"
          fi

      - name: Build frontend Sonar args
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: frontend-sonar-args
        shell: bash
        run: |
          args="-Dsonar.projectKey=${{ github.event.repository.name }}-frontend"
          args="${args} -Dsonar.scanner.skipJreProvisioning=true"
          args="${args} -Dsonar.sources=src"
          args="${args} -Dsonar.tests=test"
          args="${args} -Dsonar.test.inclusions=test/**/*.test.js"
          args="${args} -Dsonar.coverage.exclusions=src/app.js"
          if [ -f "frontend/lcov.info" ]; then
            args="${args} -Dsonar.javascript.lcov.reportPaths=lcov.info"
          fi
          if [ -n "${SONAR_ORGANIZATION}" ]; then
            args="${args} -Dsonar.organization=${SONAR_ORGANIZATION}"
          fi
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Run SonarQube analysis (frontend)
        id: frontend-sonar-scan
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: ${{ steps['frontend-sonar-args'].outputs.args }}

      - name: Retry SonarQube analysis (frontend)
        if: steps['sonar-check'].outputs.sonar_enabled == 'true' && steps['frontend-sonar-scan'].outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: ${{ steps['frontend-sonar-args'].outputs.args }}

      - name: Locate frontend Sonar report-task
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        id: report-task
        shell: bash
        run: |
          report_task="frontend/.scannerwork/report-task.txt"
          if [ ! -f "$report_task" ]; then
            echo "Unable to find frontend Sonar report-task.txt at $report_task" >&2
            exit 1
          fi
          echo "path=${report_task}" >> "$GITHUB_OUTPUT"

      - name: Wait for Quality Gate and publish frontend Sonar summary
        if: steps['sonar-check'].outputs.sonar_enabled == 'true'
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          extra_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            extra_args+=("--allow-missing-new-code-metrics")
          fi

          python3 .github/scripts/sonar_quality_gate_report.py \
            --component-name "frontend" \
            --project-key "${REPO_NAME}-frontend" \
            --report-task-file "${{ steps['report-task'].outputs.path }}" \
            --timeout-seconds 900 \
            "${extra_args[@]}"

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [ blockchain, backend, frontend, sonar-blockchain, sonar-backend, sonar-frontend ]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Compose Telegram message
        id: compose
        run: python3 .github/scripts/compose_telegram_message.py
        env:
          BLOCKCHAIN_RESULT: ${{ needs.blockchain.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SONAR_BLOCKCHAIN_RESULT: ${{ needs.sonar-blockchain.result }}
          SONAR_BACKEND_RESULT: ${{ needs.sonar-backend.result }}
          SONAR_FRONTEND_RESULT: ${{ needs.sonar-frontend.result }}
          SONAR_BLOCKCHAIN_SKIPPED: ${{ needs['sonar-blockchain'].outputs.sonar_skipped }}
          SONAR_BACKEND_SKIPPED: ${{ needs['sonar-backend'].outputs.sonar_skipped }}
          SONAR_FRONTEND_SKIPPED: ${{ needs['sonar-frontend'].outputs.sonar_skipped }}

      - name: Notify Telegram
        if: ${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.compose.outputs.message }}
          format: html

      - name: Telegram skipped (missing secrets)
        if: ${{ env.TELEGRAM_TO == '' || env.TELEGRAM_TOKEN == '' }}
        run: echo "TELEGRAM_TO and/or TELEGRAM_TOKEN are not set. Skipping Telegram notification."
